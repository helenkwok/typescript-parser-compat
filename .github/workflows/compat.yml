name: compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install typescript-estree conversion experiment
        run: npm install --prefix experiments/typescript-estree-native
      - name: Run native AST conversion experiment
        shell: bash
        run: |
          set -o pipefail
          npm --prefix experiments/typescript-estree-native run probe 2>&1 | tee typescript-estree-native-conversion-output.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Generate compatibility report
        if: always()
        run: npm run report
      - name: Add compatibility status to job summary
        if: always()
        run: |
          for report in STATUS.md TYPESCRIPT-ESTREE-API.md TYPESCRIPT-ESTREE-CONVERSION.md; do
            if [ -f "$report" ]; then
              if [ -s "$GITHUB_STEP_SUMMARY" ]; then
                printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
              fi
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-report
          path: |
            compatibility-report.json
            STATUS.md
            TYPESCRIPT-ESTREE-API.md
            TYPESCRIPT-ESTREE-CONVERSION.md
            typescript-estree-native-conversion.json
            typescript-estree-native-conversion-output.txt
            upstream/*.md
            test-output.txt
          if-no-files-found: warn
