name: compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Generate compatibility report
        if: always()
        run: npm run report
      - name: Add compatibility status to job summary
        if: always()
        run: |
          if [ -f STATUS.md ]; then
            cat STATUS.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f TYPESCRIPT-ESTREE-API.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat TYPESCRIPT-ESTREE-API.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-report
          path: |
            compatibility-report.json
            STATUS.md
            TYPESCRIPT-ESTREE-API.md
            upstream/*.md
            test-output.txt
          if-no-files-found: warn
